<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="形・国旗・国名の表示を切り替えて遊ぶ、無料の世界地図パズル。地域別・世界全体、日本語・英語に対応。">
<title>Maplet — 世界地図パズル</title>
<style>
:root{font-family:system-ui,-apple-system,"Hiragino Sans",Meiryo,sans-serif;color:#1b3733;background:#f4f8f5}*{box-sizing:border-box}body{margin:0}button,select{font:inherit}button{cursor:pointer}header{background:#174c40;color:#fff;padding:18px 22px}header>div{max-width:1200px;margin:auto}header strong{font-size:25px}header small{display:block;color:#d5ece4}main{max-width:1200px;margin:auto;padding:24px 16px 65px}h1{font-size:clamp(25px,4vw,35px);margin:0 0 10px}.muted{color:#557369;line-height:1.7;font-size:13px}.card{background:white;border:1px solid #d6e5dc;border-radius:17px;padding:16px;box-shadow:0 4px 16px #1e4a3610}.settings{display:flex;align-items:end;gap:12px;flex-wrap:wrap;margin:18px 0}.field{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700}select,button{padding:10px 12px;border-radius:9px;border:1px solid #aec9bc;background:white;color:#1c473b;min-height:42px}.primary{background:#206c51;color:#fff;border-color:#206c51}.switches{display:flex;flex-wrap:wrap;gap:8px}.switches label{background:#f3f8f4;padding:9px;border-radius:9px;font-size:14px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:16px}.map-wrap{position:relative;background:#dcecf1;border-radius:13px;overflow:hidden;margin:12px 0}#map{width:100%;height:auto;display:block;touch-action:manipulation}.land{stroke:#fff;stroke-width:.65;fill:#bacfc5;cursor:pointer}.land:hover,.land:focus-visible{fill:#8daf9e;stroke:#285c4c;stroke-width:1.4;outline:none}.land.done{fill:#26866a}.land.hint{fill:#f1bd65}.land.wrong{fill:#dc8172}.tiny{stroke:#fff;stroke-width:1;fill:#a0beb0;cursor:pointer}.tiny.done{fill:#26866a}.tiny.hint{fill:#f1bd65}.stats{display:flex;justify-content:space-between;gap:12px;font-weight:700;font-size:14px}.track{height:9px;background:#e1eee8;border-radius:10px;overflow:hidden}.fill{height:100%;background:#228566;width:0%}.side{display:flex;flex-direction:column;gap:12px}.piece{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:225px;border:2px dashed #adc5b8;background:#f8fbf9;border-radius:13px;padding:14px;text-align:center;cursor:grab}.piece svg{max-width:145px;max-height:100px}.flag{font-size:47px}.country-name{font-size:21px;font-weight:800;overflow-wrap:anywhere}.message{min-height:44px;color:#216249;font-weight:650}.actions{display:flex;gap:8px;flex-wrap:wrap}.hintline{position:absolute;bottom:8px;left:9px;background:#ffffffe8;padding:4px 8px;border-radius:6px;font-size:12px}.footer{margin-top:20px;font-size:12px;color:#5a736a}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #e3b75e;outline-offset:2px}@media(max-width:780px){.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr}.piece{min-height:165px}}@media(max-width:470px){.side{grid-template-columns:1fr}.piece{min-height:130px}.settings{gap:9px}.card{padding:12px}.stats{font-size:12px}}
</style>
</head>
<body>
<header><div><strong>🌍 Maplet</strong><small id="tagline">世界を、ひとつずつ。</small></div></header>
<main>
<h1 id="title">世界地図パズル</h1><p class="muted" id="intro">国の形・国旗・国名を自由に切り替えて、地図を完成させよう。</p>
<section class="card settings" aria-label="Game settings">
<label class="field"><span id="regionLabel">地域</span><select id="region"><option value="world">世界全体</option><option value="Asia">アジア</option><option value="Europe">ヨーロッパ</option><option value="Africa">アフリカ</option><option value="North">北米</option><option value="South">南米</option><option value="Oceania">オセアニア</option></select></label>
<label class="field"><span id="countLabel">出題数</span><select id="count"><option value="10">10か国</option><option value="20">20か国</option><option value="all">すべて</option></select></label>
<label class="field"><span id="langLabel">言語</span><select id="lang"><option value="ja">日本語</option><option value="en">English</option></select></label>
<div class="switches"><label><input id="shape" type="checkbox" checked> <span id="shapeLabel">形</span></label><label><input id="flag" type="checkbox" checked> <span id="flagLabel">国旗</span></label><label><input id="name" type="checkbox" checked> <span id="nameLabel">国名</span></label></div>
<button id="reset" class="primary">新しい問題</button>
</section>
<div class="layout">
<section class="card"><div class="stats"><span id="progress">0 / 0</span><span id="mistakes">ミス 0</span></div><div class="track"><div class="fill" id="bar"></div></div><div class="map-wrap"><svg id="map" viewBox="0 0 960 530" aria-label="World map" role="img"></svg><div class="hintline" id="maphelp">国の位置をタップして回答</div></div><p class="muted" id="instructions">地図をタップするか、カードを地図にドラッグして回答できます。</p></section>
<aside class="card side"><div class="piece" id="piece" draggable="true" aria-label="Current country"><div id="shapePreview"></div><div id="flagPreview" class="flag"></div><div id="namePreview" class="country-name"></div></div><div><p class="message" id="message" aria-live="polite"></p><div class="actions"><button id="hint">場所のヒント</button><button id="skip">後で答える</button></div><p class="muted" id="detail"></p></div></aside>
</div><p class="footer" id="footer">学習記録はこのブラウザに保存されます。境界と国・地域の扱いは学習用の簡略表示です。</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const strings={
ja:{tagline:"世界を、ひとつずつ。",title:"世界地図パズル",intro:"国の形・国旗・国名を自由に切り替えて、地図を完成させよう。",regionLabel:"地域",countLabel:"出題数",langLabel:"言語",shapeLabel:"形",flagLabel:"国旗",nameLabel:"国名",reset:"新しい問題",hint:"場所のヒント",skip:"後で答える",maphelp:"国の位置をタップして回答",instructions:"地図をタップするか、カードを地図にドラッグして回答できます。",footer:"学習記録はこのブラウザに保存されます。境界と国・地域の扱いは学習用の簡略表示です。",regions:["世界全体","アジア","ヨーロッパ","アフリカ","北米","南米","オセアニア"],correct:"正解！",wrong:"違う国です。もう一度！",finish:"完成！おめでとう！",loading:"地図と国名を読み込んでいます…",error:"地図データの読み込みに失敗しました。接続を確認して再読み込みしてください。",miss:"ミス",hintmessage:"オレンジの国を探してみよう！",empty:"この地域のデータがありません。",shapeHelp:"国の形を見て答えよう"},
en:{tagline:"One country at a time.",title:"World map puzzle",intro:"Show or hide the shape, flag and name, then complete the map.",regionLabel:"Region",countLabel:"Questions",langLabel:"Language",shapeLabel:"Shape",flagLabel:"Flag",nameLabel:"Name",reset:"New game",hint:"Show location",skip:"Skip for now",maphelp:"Tap the country on the map",instructions:"Tap a country on the map, or drag the card onto it.",footer:"Progress is saved in this browser. Borders and country coverage are simplified for learning.",regions:["World","Asia","Europe","Africa","North America","South America","Oceania"],correct:"Correct!",wrong:"That's a different country. Try again!",finish:"Complete! Well done!",loading:"Loading map and country data…",error:"Map data failed to load. Check your connection and reload.",miss:"Mistakes",hintmessage:"Find the orange country!",empty:"No data for this region.",shapeHelp:"Identify the country by its shape"}
};
let lang="ja",records=[],features=[],byId=new Map(),quiz=[],done=[],idx=0,miss=0,region="world",projection,path,hintId=null;
const regions=["world","Asia","Europe","Africa","North","South","Oceania"];
const key="maplet-github-v1";let flags={shape:true,flag:true,name:true};
const tr=k=>strings[lang][k];
function name(c){if(lang==="en")return c.name.common;try{return new Intl.DisplayNames(["ja"],{type:"region"}).of(c.cca2)||c.name.common}catch(e){return c.name.common}}
function belongs(c,r){if(r==="world")return true;if(r==="North")return c.region==="Americas"&&c.subregion!=="South America";if(r==="South")return c.region==="Americas"&&c.subregion==="South America";return c.region===r}
function current(){return quiz[idx]}
function store(){try{localStorage.setItem(key,JSON.stringify({region,count:$("count").value,lang,flags,ids:quiz.map(x=>x.ccn3),done,idx,miss}))}catch(e){}}
function labels(){document.documentElement.lang=lang;for(const k of Object.keys(strings[lang]))if($(k))$(k).textContent=tr(k);Array.from($("region").options).forEach((o,i)=>o.textContent=tr("regions")[i]);Array.from($("count").options).forEach((o,i)=>o.textContent=i===2?(lang==="ja"?"すべて":"All"):(i===0?"10":"20")+(lang==="ja"?"か国":" countries"));$("mistakes").textContent=tr("miss")+" "+miss}
function reorder(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function setRegion(){region=$("region").value;const subset=records.filter(c=>belongs(c,region)).map(c=>byId.get(c.ccn3)).filter(Boolean);const geo={type:"FeatureCollection",features:subset.length?subset:features};projection=region==="world"?d3.geoNaturalEarth1():d3.geoMercator();projection.fitExtent([[20,24],[940,502]],geo);path=d3.geoPath(projection)}
function draw(){if(!features.length)return;setRegion();const svg=d3.select("#map");svg.selectAll("*").remove();svg.append("path").datum({type:"Sphere"}).attr("d",path).attr("fill","#d8edf2").attr("stroke","#a7cbd3");svg.selectAll("path.land").data(features.filter(f=>region==="world"||belongs(f.record,region)),d=>d.id).join("path").attr("class",d=>"land"+(done.includes(d.id)?" done":"")+(hintId===d.id?" hint":"")).attr("d",path).attr("data-id",d=>d.id).attr("tabindex",0).attr("role","button").attr("aria-label",d=>name(d.record)).on("click",(_,d)=>answer(d.id)).on("keydown",(event,d)=>{if(event.key==="Enter"||event.key===" "){event.preventDefault();answer(d.id)}});svg.selectAll("circle.tiny").data(features.filter(f=>(region==="world"||belongs(f.record,region))&&path.area(f)<18&&path.centroid(f).every(Number.isFinite)),d=>d.id).join("circle").attr("class",d=>"tiny"+(done.includes(d.id)?" done":"")+(hintId===d.id?" hint":"")).attr("cx",d=>path.centroid(d)[0]).attr("cy",d=>path.centroid(d)[1]).attr("r",6).attr("data-id",d=>d.id).on("click",(_,d)=>answer(d.id));}
function piece(){const c=current();$("progress").textContent=idx+" / "+quiz.length;$("bar").style.width=(quiz.length?100*idx/quiz.length:0)+"%";$("mistakes").textContent=tr("miss")+" "+miss;$("hint").disabled=!c;$("skip").disabled=!c||idx>=quiz.length-1;const el=$("shapePreview");el.replaceChildren();$("flagPreview").textContent=c&&flags.flag?c.flag:"";$("namePreview").textContent=c&&flags.name?name(c):"";$("detail").textContent=c?(lang==="ja"?"残り ":"Remaining ")+(quiz.length-idx):"";if(!c){if(quiz.length)$("message").textContent=tr("finish");return;}if(flags.shape){const f=byId.get(c.ccn3),p=d3.geoMercator().fitExtent([[9,9],[130,82]],f),s=d3.create("svg").attr("viewBox","0 0 140 90").attr("width",140).attr("height",90);s.append("path").datum(f).attr("d",d3.geoPath(p)).attr("fill","#3b9474").attr("stroke","#24644f").attr("stroke-width",1.5);el.appendChild(s.node())}if(!flags.shape&&!flags.flag&&!flags.name){flags.name=true;$("name").checked=true;$("namePreview").textContent=name(c)}}
function answer(id){const c=current();if(!c)return;if(id===c.ccn3){done.push(id);idx++;hintId=null;$("message").textContent=idx===quiz.length?tr("finish"):tr("correct");store();draw();piece()}else{miss++;$("message").textContent=tr("wrong");$("mistakes").textContent=tr("miss")+" "+miss;store();d3.selectAll('[data-id="'+id+'"]').classed("wrong",true);setTimeout(()=>d3.selectAll('[data-id="'+id+'"]').classed("wrong",false),550)}}
function newGame(){if(!records.length)return;region=$("region").value;let pool=reorder(records.filter(c=>belongs(c,region)&&byId.has(c.ccn3)));const n=$("count").value;quiz=n==="all"?pool:pool.slice(0,Number(n));done=[];idx=0;miss=0;hintId=null;$("message").textContent=quiz.length?"":tr("empty");store();draw();piece()}
function restore(){try{const v=JSON.parse(localStorage.getItem(key)||"null");if(!v)return false;lang=v.lang==="en"?"en":"ja";$("lang").value=lang;region=regions.includes(v.region)?v.region:"world";$("region").value=region;$("count").value=["10","20","all"].includes(v.count)?v.count:"10";flags={shape:v.flags?.shape!==false,flag:v.flags?.flag!==false,name:v.flags?.name!==false};for(const k of ["shape","flag","name"])$(k).checked=flags[k];quiz=(v.ids||[]).map(id=>records.find(c=>c.ccn3===id)).filter(Boolean);if(!quiz.length)return false;idx=Math.max(0,Math.min(quiz.length,Number(v.idx)||0));done=(v.done||[]).filter(id=>quiz.some(c=>c.ccn3===id));miss=Number(v.miss)||0;return true}catch(e){return false}}
function listeners(){$("lang").addEventListener("change",()=>{lang=$("lang").value;labels();draw();piece();store()});for(const k of ["shape","flag","name"])$(k).addEventListener("change",()=>{flags[k]=$(k).checked;if(!Object.values(flags).some(Boolean)){flags[k]=true;$(k).checked=true}piece();store()});for(const k of ["region","count"])$(k).addEventListener("change",newGame);$("reset").addEventListener("click",newGame);$("hint").addEventListener("click",()=>{if(!current())return;hintId=current().ccn3;$("message").textContent=tr("hintmessage");draw()});$("skip").addEventListener("click",()=>{if(!current()||idx===quiz.length-1)return;const [c]=quiz.splice(idx,1);quiz.push(c);hintId=null;$("message").textContent="";store();draw();piece()});$("piece").addEventListener("dragstart",e=>{if(!current())e.preventDefault()});$("map").addEventListener("dragover",e=>e.preventDefault());$("map").addEventListener("drop",e=>{e.preventDefault();const el=document.elementFromPoint(e.clientX,e.clientY);const id=el?.getAttribute?.("data-id");if(id)answer(id)})}
async function start(){listeners();$("message").textContent=tr("loading");try{if(!window.d3||!window.topojson)throw Error("Library missing");const [geo,localCountries]=await Promise.all([fetch("./world-map.json").then(r=>{if(!r.ok)throw Error("world-map.json");return r.json()}),fetch("./countries.json").then(r=>{if(!r.ok)throw Error("countries.json");return r.json()})]);if(!Array.isArray(localCountries))throw Error("Invalid country list");const candidates=localCountries.map(c=>({ccn3:c.id,cca2:c.iso,name:{common:c.en},region:({AF:"Africa",AS:"Asia",EU:"Europe",OC:"Oceania",NA:"Americas",SA:"Americas"}[c.continent]||"Other"),subregion:c.continent==="SA"?"South America":c.continent==="NA"?"North America":"",flag:[...c.iso].map(x=>String.fromCodePoint(127397+x.charCodeAt(0))).join("")}));const raw=topojson.feature(geo,geo.objects.countries).features;const shapeMap=new Map(raw.map(f=>[String(f.id).padStart(3,"0"),f]));records=candidates.filter(c=>shapeMap.has(c.ccn3));features=records.map(c=>{const f=shapeMap.get(c.ccn3);f.id=c.ccn3;f.record=c;return f});byId=new Map(features.map(f=>[f.id,f]));if(!records.length)throw Error("Country matching failed");const restored=restore();labels();if(restored){draw();piece()}else newGame();$("message").textContent=""}catch(e){console.error(e);$("message").textContent=tr("error")}}
start();
})();
</script></body></html>
