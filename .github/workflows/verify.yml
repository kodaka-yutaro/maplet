name: Verify Maplet geography
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check app.js
      - run: node scripts/verify-map.mjs
      - run: npm install --no-save playwright-core
      - run: node scripts/smoke-map.mjs
